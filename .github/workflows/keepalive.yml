# Keeps the free Supabase project from pausing (it pauses after 7 days without database queries,
# which would take the website and the API offline). Runs on GitHub's servers, independent of any
# laptop. The Vercel cron in vercel.json does the same thing; either one alone is enough.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC (about 9 AM in Champaign)
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the keepalive endpoint (retries 3 times)
        run: |
          for i in 1 2 3; do
            body=$(curl -s --max-time 30 https://shift-schedule-website.vercel.app/api/v1/keepalive || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 20
          done
          echo "Keepalive failed 3 times. The site or database may be down." >&2
          exit 1
